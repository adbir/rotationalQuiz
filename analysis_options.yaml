# Lints: the Flutter defaults plus stricter rules that back up the
# conventions in CLAUDE.md ("Code organisation"). `flutter analyze` must be
# clean before pushing.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - lib/**/*.g.dart

linter:
  rules:
    # Correctness
    - avoid_dynamic_calls
    - unawaited_futures
    - discarded_futures
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    - throw_in_finally
    - no_adjacent_strings_in_list
    - avoid_type_to_string
    # Immutability and clarity
    - prefer_final_locals
    - prefer_final_in_for_each
    - prefer_final_fields
    - always_declare_return_types
    - avoid_returning_null_for_void
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_super_parameters
    - avoid_redundant_argument_values
    - prefer_single_quotes
    - directives_ordering
    - sort_constructors_first
    - sort_unnamed_constructors_first
    # Public API surface
    - library_private_types_in_public_api
    # Deliberately not enabled:
    # - avoid_positional_boolean_parameters: breaks ViewModel setter
    #   tear-offs such as `onChanged: vm.setMoving`.
    # - avoid_classes_with_only_static_members: `abstract final class` of
    #   constants (AppTheme) is the idiomatic way to group them.
