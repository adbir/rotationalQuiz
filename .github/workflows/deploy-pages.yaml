name: Deploy web app to GitHub Pages

# Builds the Flutter web app from main and publishes it to
# https://<owner>.github.io/<repo>/.
#
# One-time setup: the repository must be public (or on a plan that allows
# private Pages) and Settings → Pages → "Build and deployment" → Source must
# be "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only the latest push deploys; an in-progress deploy finishes first.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      # Pages serves the site under /<repo>/, so assets need that base path.
      # The title bar shows the pubspec version, the run number and the commit.
      # No service worker: it kept serving the previous build after a hard
      # reload, so new builds took two loads to appear.
      - run: |
          version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          flutter build web --release --pwa-strategy=none             --base-href "/${{ github.event.repository.name }}/"             --dart-define="APP_VERSION=v$version build ${{ github.run_number }} (${GITHUB_SHA::7})"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
